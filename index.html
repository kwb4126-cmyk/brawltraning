<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>브롤스타즈 트레이닝 사이트 (디노)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: #0f0f13;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 메인 메뉴 화면 */
        #menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2c2c54 0%, #10101b 100%);
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
            color: #ffd700;
            text-shadow: 0 4px 10px rgba(0,0,0,0.6);
            letter-spacing: 1px;
        }
        .subtitle {
            color: #a4b0be;
            font-size: 15px;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 280px;
        }
        .main-btn {
            padding: 16px 24px;
            font-size: 17px;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: 0.15s;
            color: white;
        }
        .btn-dodge { background: linear-gradient(135deg, #ff4757, #ff6b81); }
        .btn-aim { background: linear-gradient(135deg, #2ed573, #7bed9f); }
        .main-btn:active { transform: scale(0.96); }

        /* 게임 창 외부 여백(테두리) 스타일 적용 */
        #game-container {
            position: relative;
            width: 94vw;
            height: 90vh;
            max-width: 1100px;
            max-height: 700px;
            background-color: #1e272e;
            border: 5px solid #3d3d5c;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            display: none;
            overflow: hidden;
        }
        #game-container.active {
            display: block;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            background-color: #2f3542;
        }

        /* 개선된 상단 UI 패널 */
        #ui-panel {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .hud-group {
            display: flex;
            gap: 10px;
        }
        .hud-badge {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 15px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #score-board { color: #00d2d3; }
        #difficulty-board { color: #ffa502; }
        #ammo-board { color: #fffa65; }
        #life-board { color: #ff6b81; }

        .btn-back {
            position: absolute;
            top: 15px;
            left: 20px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            z-index: 10;
            transition: 0.15s;
        }
        .btn-back:active { transform: scale(0.94); }

        .guide {
            position: absolute;
            bottom: 12px;
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
            z-index: 5;
        }

        /* AI 피드백 모달 오버레이 스타일 */
        #ai-modal {
            position: absolute;
            inset: 0;
            background: rgba(11, 19, 43, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 30px;
            text-align: center;
        }
        .ai-card {
            background: #1e272e;
            border: 3px solid #ff4757;
            border-radius: 20px;
            padding: 25px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .ai-title {
            color: #ff4757;
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 12px;
        }
        .ai-content {
            font-size: 15px;
            line-height: 1.6;
            color: #f1f2f6;
            margin-bottom: 24px;
            background: rgba(0,0,0,0.3);
            padding: 14px;
            border-radius: 10px;
            border-left: 4px solid #ff4757;
        }
        .ai-btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .ai-btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-retry { background: #2ed573; color: white; }
        .btn-home { background: #747d8c; color: white; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 메인 메뉴 -->
    <div id="menu">
        <h1>브롤스타즈 트레이닝 사이트 (디노)</h1>
        <div class="subtitle">실전 감각을 극대화하는 맞춤형 트레이너</div>
        <div class="btn-group">
            <button class="main-btn btn-dodge" onclick="startGame('dodge')">무빙 훈련 (회피)</button>
            <button class="main-btn btn-aim" onclick="startGame('aim')">저격 에임 훈련 (사격)</button>
        </div>
    </div>

    <!-- 게임 화면 (테두리가 있는 창 형태) -->
    <div id="game-container">
        <button class="btn-back" onclick="returnToMenu()">메뉴로</button>
        
        <div id="ui-panel">
            <div class="hud-group">
                <div class="hud-badge" id="score-board">점수: 0</div>
                <div class="hud-badge" id="difficulty-board">속도: x1.0</div>
            </div>
            <div class="hud-group">
                <div class="hud-badge" id="ammo-board">탄창: 🟡🟡🟡</div>
                <div class="hud-badge" id="life-board">생명: ❤️❤️❤️</div>
            </div>
        </div>

        <canvas id="canvas"></canvas>
        <div class="guide" id="guide-text">조작 가이드</div>

        <!-- AI 피드백 모달 -->
        <div id="ai-modal">
            <div class="ai-card">
                <div class="ai-title">🤖 디노 AI 코치 분석 보고서</div>
                <div class="ai-content" id="ai-feedback-text">분석 중...</div>
                <div class="ai-btn-group">
                    <button class="ai-btn btn-retry" onclick="restartGame()">다시 도전</button>
                    <button class="ai-btn btn-home" onclick="returnToMenu()">메뉴로</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const gameContainer = document.getElementById('game-container');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('score-board');
        const difficultyBoard = document.getElementById('difficulty-board');
        const ammoBoard = document.getElementById('ammo-board');
        const lifeBoard = document.getElementById('life-board');
        const guideText = document.getElementById('guide-text');
        const aiModal = document.getElementById('ai-modal');
        const aiFeedbackText = document.getElementById('ai-feedback-text');

        let currentMode = null;
        let animationFrameId = null;
        let score = 0;
        let lives = 3;
        let ammo = 3;
        let ammoRegenTimer = 0;
        let gameRunning = false;
        let gameTime = 0; // 생존 시간 측정용

        function getDifficulty() {
            return Math.min(3.5, 1 + score / 250);
        }

        let player = {
            x: 0,
            y: 0,
            radius: 18,
            speed: 4.5,
            color: '#1e90ff'
        };

        // 이동 조이스틱
        let joystick = {
            active: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            currentX: 0,
            currentY: 0,
            maxDist: 45
        };

        // 저격 에임 스틱
        let aimStick = {
            active: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            currentX: 0,
            currentY: 0
        };

        let entities = []; 
        let bullets = [];  
        let spawnCounter = 0;
        let activeTouches = {};

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        canvas.addEventListener('pointerdown', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            activeTouches[e.pointerId] = pos;

            // 무빙 모드이거나, 저격 모드에서 첫 터치인 경우 -> 이동 조이스틱 생성
            if (!joystick.active) {
                joystick.active = true;
                joystick.pointerId = e.pointerId;
                joystick.startX = pos.x;
                joystick.startY = pos.y;
                joystick.currentX = pos.x;
                joystick.currentY = pos.y;
            } 
            // 저격 모드이고 이동 스틱이 이미 있는 상태라면 -> 두 번째 손가락으로 에임 스틱 생성 (저격 모드선 이동 불가!)
            else if (currentMode === 'aim' && !aimStick.active && ammo > 0 && e.pointerId !== joystick.pointerId) {
                aimStick.active = true;
                aimStick.pointerId = e.pointerId;
                aimStick.startX = pos.x;
                aimStick.startY = pos.y;
                aimStick.currentX = pos.x;
                aimStick.currentY = pos.y;
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!gameRunning) return;
            if (!activeTouches[e.pointerId]) return;
            const rect = canvas.getBoundingClientRect();
            const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            activeTouches[e.pointerId] = pos;

            if (joystick.active && e.pointerId === joystick.pointerId) {
                joystick.currentX = pos.x;
                joystick.currentY = pos.y;
            }
            if (aimStick.active && e.pointerId === aimStick.pointerId) {
                aimStick.currentX = pos.x;
                aimStick.currentY = pos.y;
            }
        });

        canvas.addEventListener('pointerup', (e) => { handlePointerEnd(e); });
        canvas.addEventListener('pointercancel', (e) => { handlePointerEnd(e); });

        function handlePointerEnd(e) {
            delete activeTouches[e.pointerId];

            if (joystick.active && e.pointerId === joystick.pointerId) {
                joystick.active = false;
                joystick.pointerId = null;
            }

            if (aimStick.active && e.pointerId === aimStick.pointerId) {
                if (currentMode === 'aim' && ammo > 0) {
                    let dx = aimStick.currentX - aimStick.startX;
                    let dy = aimStick.currentY - aimStick.startY;
                    let dist = Math.hypot(dx, dy);

                    if (dist > 15) {
                        let angle = Math.atan2(dy, dx);
                        bullets.push({
                            x: player.x,
                            y: player.y,
                            vx: Math.cos(angle) * 13,
                            vy: Math.sin(angle) * 13,
                            radius: 7,
                            distanceTraveled: 0,
                            maxDistance: Math.max(canvas.width, canvas.height) * 0.8
                        });
                        ammo--;
                    }
                }
                aimStick.active = false;
                aimStick.pointerId = null;
            }
        }

        function startGame(mode) {
            currentMode = mode;
            menu.classList.add('hidden');
            gameContainer.classList.add('active');
            aiModal.style.display = 'none';

            resizeCanvas();

            score = 0;
            lives = 3;
            ammo = 3;
            ammoRegenTimer = 0;
            gameTime = 0;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            entities = [];
            bullets = [];
            spawnCounter = 0;
            gameRunning = true;

            if (currentMode === 'dodge') {
                guideText.innerText = "[무빙 훈련] 화면을 드래그해 사방에서 날아오는 탄환을 회피하세요!";
            } else {
                guideText.innerText = "[저격 에임 훈련] 조준 시 제자리 고정! 드래그 후 손을 떼어 저격 발사!";
            }

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function restartGame() {
            startGame(currentMode);
        }

        function returnToMenu() {
            gameRunning = false;
            cancelAnimationFrame(animationFrameId);
            aiModal.style.display = 'none';
            gameContainer.classList.remove('active');
            menu.classList.remove('hidden');
        }

        function triggerGameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationFrameId);
            
            // 디노 AI 코치의 맞춤형 피드백 생성
            let feedback = "";
            if (currentMode === 'dodge') {
                if (score < 100) {
                    feedback = `생존 시간 약 ${Math.floor(gameTime/60)}초, 점수 ${score}점.\n탄환이 집중될 때 한쪽 방향으로만 무빙하면 위험합니다. 불규칙한 무빙과 무빙 폭을 좁게 가져가는 연습을 해보세요!`;
                } else if (score < 400) {
                    feedback = `생존 시간 약 ${Math.floor(gameTime/60)}초, 점수 ${score}점.\n상당한 회피 능력을 보여주셨네요! 난이도가 급증하는 후반 구간에서 동선을 더 넓게 확보하면 고득점이 가능합니다.`;
                } else {
                    feedback = `생존 시간 약 ${Math.floor(gameTime/60)}초, 점수 ${score}점.\n완벽한 무빙 실력입니다! 프로 브롤러 수준의 회피 기동을 보여주셨습니다. 브이아이피 등극 수준!`;
                }
            } else {
                if (score < 300) {
                    feedback = `달성 점수 ${score}점.\n저격 모드에서는 에임을 맞추는 동안 캐릭터가 멈추므로 적의 위치를 미리 예측하고 신속하게  flick shot(플릭 샷)을 날리는 연습이 필요합니다.`;
                } else {
                    feedback = `달성 점수 ${score}점.\n훌륭한 에임 적중률입니다! 탄창 관리와 정교한 각도 조절 능력이 아주 뛰어납니다.`;
                }
            }
            
            aiFeedbackText.innerText = feedback;
            aiModal.style.display = 'flex';
        }

        function gameLoop() {
            if (!gameRunning) return;
            gameTime++;
            update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function update() {
            const difficulty = getDifficulty();

            // 저격 모드(aim)일 때는 에임 스틱을 당기는 동안 이동을 강제로 차단함
            if (joystick.active && !(currentMode === 'aim' && aimStick.active)) {
                let dx = joystick.currentX - joystick.startX;
                let dy = joystick.currentY - joystick.startY;
                let dist = Math.hypot(dx, dy);

                if (dist > 2) {
                    let angle = Math.atan2(dy, dx);
                    let moveDist = Math.min(dist, joystick.maxDist) / joystick.maxDist * player.speed;
                    player.x += Math.cos(angle) * moveDist;
                    player.y += Math.sin(angle) * moveDist;

                    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
                    player.y = Math.max(player.radius + 40, Math.min(canvas.height - player.radius, player.y));
                }
            }

            if (currentMode === 'aim' && ammo < 3) {
                ammoRegenTimer++;
                if (ammoRegenTimer >= 80) {
                    ammo++;
                    ammoRegenTimer = 0;
                }
            }

            spawnCounter--;

            if (currentMode === 'dodge') {
                const spawnInterval = Math.max(8, Math.round(28 / difficulty));
                if (spawnCounter <= 0) {
                    spawnCounter = spawnInterval;
                    let side = Math.floor(Math.random() * 4);
                    let x, y;
                    if (side === 0) { x = Math.random() * canvas.width; y = 0; }
                    else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height; }
                    else if (side === 2) { x = 0; y = Math.random() * canvas.height; }
                    else { x = canvas.width; y = Math.random() * canvas.height; }

                    let angle = Math.atan2(player.y - y, player.x - x);
                    let speed = (2.8 + Math.random() * 1.8) * difficulty;

                    entities.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: 9 });
                }

                for (let i = entities.length - 1; i >= 0; i--) {
                    let b = entities[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    let dist = Math.hypot(player.x - b.x, player.y - b.y);
                    if (dist < player.radius + b.radius) {
                        entities.splice(i, 1);
                        lives--;
                        if (lives <= 0) {
                            triggerGameOver();
                            return;
                        }
                    } else if (b.x < -40 || b.x > canvas.width + 40 || b.y < -40 || b.y > canvas.height + 40) {
                        entities.splice(i, 1);
                        score += 10;
                    }
                }

            } else if (currentMode === 'aim') {
                const spawnInterval = Math.max(20, Math.round(60 / difficulty));
                if (spawnCounter <= 0 && entities.length < 5) {
                    spawnCounter = spawnInterval;
                    let ex = Math.random() < 0.5 ? 60 : canvas.width - 60;
                    let ey = Math.random() * (canvas.height - 150) + 80;
                    entities.push({
                        x: ex, y: ey,
                        vx: (Math.random() - 0.5) * 2.2 * difficulty,
                        vy: (Math.random() - 0.5) * 2.2 * difficulty,
                        radius: 20,
                        lifeTime: 0
                    });
                }

                for (let i = entities.length - 1; i >= 0; i--) {
                    let target = entities[i];
                    target.x += target.vx;
                    target.y += target.vy;
                    if (target.x < 40 || target.x > canvas.width - 40) target.vx *= -1;
                    if (target.y < 60 || target.y > canvas.height - 40) target.vy *= -1;

                    target.lifeTime++;
                    if (target.lifeTime > 260) {
                        entities.splice(i, 1);
                        lives--;
                        if (lives <= 0) {
                            triggerGameOver();
                            return;
                        }
                    }
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    let bullet = bullets[i];
                    bullet.x += bullet.vx;
                    bullet.y += bullet.vy;
                    bullet.distanceTraveled += Math.hypot(bullet.vx, bullet.vy);

                    let hitIndex = -1;
                    for (let j = 0; j < entities.length; j++) {
                        let target = entities[j];
                        if (Math.hypot(bullet.x - target.x, bullet.y - target.y) < bullet.radius + target.radius) {
                            hitIndex = j;
                            break;
                        }
                    }

                    if (hitIndex !== -1) {
                        entities.splice(hitIndex, 1);
                        bullets.splice(i, 1);
                        score += 150;
                    } else if (bullet.distanceTraveled >= bullet.maxDistance || bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height) {
                        bullets.splice(i, 1);
                    }
                }
            }

            scoreBoard.innerText = `점수: ${score}`;
            difficultyBoard.innerText = `속도: x${difficulty.toFixed(1)}`;
            let ammoStrs = '';
            for (let i = 0; i < 3; i++) ammoStrs += (i < ammo) ? '🟡' : '⚪';
            ammoBoard.innerText = `탄창: ${ammoStrs}`;
            
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️';
            lifeBoard.innerText = `생명: ${hearts}`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 맵 배경 격자 패턴
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 1;
            let gridSize = 50;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 에임 조준선 가이드라인 (저격 모드에서 정지 상태 시 시각화)
            if (currentMode === 'aim' && aimStick.active) {
                let dx = aimStick.currentX - aimStick.startX;
                let dy = aimStick.currentY - aimStick.startY;
                let dist = Math.hypot(dx, dy);
                if (dist > 15) {
                    let angle = Math.atan2(dy, dx);
                    ctx.beginPath();
                    ctx.moveTo(player.x, player.y);
                    ctx.lineTo(player.x + Math.cos(angle) * 320, player.y + Math.sin(angle) * 320);
                    ctx.strokeStyle = 'rgba(255, 234, 167, 0.7)';
                    ctx.lineWidth = 4;
                    ctx.setLineDash([8, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.closePath();
                }
            }

            // 플레이어 캐릭터
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = (currentMode === 'aim' && aimStick.active) ? '#70a1ff' : player.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.closePath();

            // 오브젝트 및 탄환 렌더링
            if (currentMode === 'dodge') {
                for (let b of entities) {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff4757';
                    ctx.fill();
                    ctx.closePath();
                }
            } else if (currentMode === 'aim') {
                for (let t of entities) {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff6b81';
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                    ctx.closePath();
                }
                for (let bullet of bullets) {
                    ctx.beginPath();
                    ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffd700';
                    ctx.fill();
                    ctx.closePath();
                }
            }

            // 이동 조이스틱 시각화
            if (joystick.active) {
                ctx.beginPath();
                ctx.arc(joystick.startX, joystick.startY, 42, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.stroke();
                ctx.closePath();

                let dx = joystick.currentX - joystick.startX;
                let dy = joystick.currentY - joystick.startY;
                let dist = Math.hypot(dx, dy);
                let stickX = joystick.startX + (dist > joystick.maxDist ? dx / dist * joystick.maxDist : dx);
                let stickY = joystick.startY + (dist > joystick.maxDist ? dy / dist * joystick.maxDist : dy);

                ctx.beginPath();
                ctx.arc(stickX, stickY, 20, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.fill();
                ctx.closePath();
            }

            // 에임 조이스틱 시각화
            if (aimStick.active) {
                ctx.beginPath();
                ctx.arc(aimStick.startX, aimStick.startY, 42, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(46, 213, 115, 0.12)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(46, 213, 115, 0.25)';
                ctx.stroke();
                ctx.closePath();

                let dx = aimStick.currentX - aimStick.startX;
                let dy = aimStick.currentY - aimStick.startY;
                let dist = Math.hypot(dx, dy);
                let stickX = aimStick.startX + (dist > 45 ? dx / dist * 45 : dx);
                let stickY = aimStick.startY + (dist > 45 ? dy / dist * 45 : dy);

                ctx.beginPath();
                ctx.arc(aimStick.X || stickX, stickY, 20, 0, Math.PI * 2);
                // 실시간 렌더링용 위치 적용
                ctx.arc(stickX, stickY, 20, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(46, 213, 115, 0.55)';
                ctx.fill();
                ctx.closePath();
            }
        }
    </script>
