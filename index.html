<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>브롤스타즈 트레이닝 사이트 (디노)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            margin: 5px 0 10px 0;
            font-size: 28px;
            color: #ffd700;
            text-shadow: 2px 2px #000;
        }
        p {
            color: #dcdde1;
        }
        #menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2c2c54, #1b1464);
        }
        .btn-group {
            display: flex;
            gap: 20px;
            margin-top: 25px;
        }
        button {
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            transition: 0.15s;
        }
        .btn-dodge { background-color: #ff4757; color: white; }
        .btn-aim { background-color: #2ed573; color: white; }
        .btn-back {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 8px 16px;
            font-size: 14px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            z-index: 10;
        }
        button:active { transform: scale(0.95); }

        /* 게임 컨테이너 및 캔버스 화면 꽉 채우기 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: none;
            background-color: #2f3542;
        }
        #game-container.active {
            display: block;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* 상단 브롤 스타일 HUD 오버레이 */
        #ui-panel {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            pointer-events: none;
            z-index: 5;
            font-size: 18px;
            font-weight: 900;
            text-shadow: 2px 2px 0px #000;
        }
        .hud-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        #difficulty-board { color: #ffa502; }

        .guide {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 1px 1px #000;
            pointer-events: none;
            z-index: 5;
        }

        .hidden {
            display: none !important;
        }

        /* 세로 모드 안내 오버레이 */
        .rotate-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #0d0d0d;
            color: #fff;
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 14px;
            padding: 20px;
        }
        .rotate-icon {
            font-size: 64px;
            animation: rotatePulse 1.3s ease-in-out infinite;
        }
        @keyframes rotatePulse {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        @media screen and (orientation: portrait) and (max-width: 1024px) {
            #menu, #game-container { display: none !important; }
            .rotate-overlay { display: flex; }
        }
    </style>
</head>
<body>

    <div class="rotate-overlay" id="rotateOverlay">
        <div class="rotate-icon">📱</div>
        <h1 style="margin:0;">가로모드로 플레이해주세요</h1>
        <p>기기를 옆으로 돌리면 브롤스타즈 트레이닝 사이트 (디노)가 시작됩니다.</p>
    </div>

    <!-- 메인 메뉴 -->
    <div id="menu">
        <h1>브롤스타즈 트레이닝 사이트 (디노)</h1>
        <p>원하는 훈련 모드를 선택하세요</p>
        <div class="btn-group">
            <button class="btn-dodge" onclick="startGame('dodge')">무빙 훈련 (회피)</button>
            <button class="btn-aim" onclick="startGame('aim')">저격 에임 훈련 (사격)</button>
        </div>
    </div>

    <!-- 게임 화면 (전체 화면 꽉 참) -->
    <div id="game-container">
        <button class="btn-back" onclick="returnToMenu()">⬅ 메뉴</button>
        <div id="ui-panel">
            <div class="hud-box" id="score-board">점수: 0</div>
            <div class="hud-box" id="difficulty-board">속도: x1.0</div>
            <div class="hud-box" id="ammo-board">탄창: 🟡🟡🟡</div>
            <div class="hud-box" id="life-board">생명: ❤️❤️❤️</div>
        </div>
        <canvas id="canvas"></canvas>
        <div class="guide" id="guide-text">화면 아무 곳이나 터치하면 그 자리에 조이스틱이 생깁니다!</div>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const gameContainer = document.getElementById('game-container');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('score-board');
        const difficultyBoard = document.getElementById('difficulty-board');
        const ammoBoard = document.getElementById('ammo-board');
        const lifeBoard = document.getElementById('life-board');
        const guideText = document.getElementById('guide-text');

        let currentMode = null;
        let animationFrameId = null;
        let score = 0;
        let lives = 3;
        let ammo = 3;
        let ammoRegenTimer = 0;
        let gameRunning = false;

        function getDifficulty() {
            return Math.min(3.0, 1 + score / 300);
        }

        let player = {
            x: 0,
            y: 0,
            radius: 20,
            speed: 5,
            color: '#1e90ff'
        };

        let joystick = {
            active: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            currentX: 0,
            currentY: 0,
            maxDist: 50
        };

        let aimStick = {
            active: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            currentX: 0,
            currentY: 0
        };

        let entities = []; 
        let bullets = [];  
        let spawnCounter = 0;
        let activeTouches = {};

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        function getTouchPos(e) {
            return {
                x: e.clientX,
                y: e.clientY
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!gameRunning) return;
            const pos = getTouchPos(e);
            activeTouches[e.pointerId] = pos;

            if (!joystick.active) {
                joystick.active = true;
                joystick.pointerId = e.pointerId;
                joystick.startX = pos.x;
                joystick.startY = pos.y;
                joystick.currentX = pos.x;
                joystick.currentY = pos.y;
            } 
            else if (currentMode === 'aim' && !aimStick.active && ammo > 0 && e.pointerId !== joystick.pointerId) {
                aimStick.active = true;
                aimStick.pointerId = e.pointerId;
                aimStick.startX = pos.x;
                aimStick.startY = pos.y;
                aimStick.currentX = pos.x;
                aimStick.currentY = pos.y;
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!gameRunning) return;
            if (!activeTouches[e.pointerId]) return;
            const pos = getTouchPos(e);
            activeTouches[e.pointerId] = pos;

            if (joystick.active && e.pointerId === joystick.pointerId) {
                joystick.currentX = pos.x;
                joystick.currentY = pos.y;
            }
            if (aimStick.active && e.pointerId === aimStick.pointerId) {
                aimStick.currentX = pos.x;
                aimStick.currentY = pos.y;
            }
        });

        canvas.addEventListener('pointerup', (e) => { handlePointerEnd(e); });
        canvas.addEventListener('pointercancel', (e) => { handlePointerEnd(e); });

        function handlePointerEnd(e) {
            delete activeTouches[e.pointerId];

            if (joystick.active && e.pointerId === joystick.pointerId) {
                joystick.active = false;
                joystick.pointerId = null;
            }

            if (aimStick.active && e.pointerId === aimStick.pointerId) {
                if (currentMode === 'aim' && ammo > 0) {
                    let dx = aimStick.currentX - aimStick.startX;
                    let dy = aimStick.currentY - aimStick.startY;
                    let dist = Math.hypot(dx, dy);

                    if (dist > 15) {
                        let angle = Math.atan2(dy, dx);
                        bullets.push({
                            x: player.x,
                            y: player.y,
                            vx: Math.cos(angle) * 14,
                            vy: Math.sin(angle) * 14,
                            radius: 8,
                            distanceTraveled: 0,
                            maxDistance: Math.max(canvas.width, canvas.height) * 0.7
                        });
                        ammo--;
                    }
                }
                aimStick.active = false;
                aimStick.pointerId = null;
            }
        }

        function startGame(mode) {
            currentMode = mode;
            menu.classList.add('hidden');
            gameContainer.classList.add('active');

            resizeCanvas();

            score = 0;
            lives = 3;
            ammo = 3;
            ammoRegenTimer = 0;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            entities = [];
            bullets = [];
            spawnCounter = 0;
            gameRunning = true;

            if (currentMode === 'dodge') {
                guideText.innerText = "[무빙 훈련] 화면 어디든 터치하고 드래그해 탄환을 피하세요!";
            } else {
                guideText.innerText = "[저격 에임 훈련] 한 손가락 이동, 다른 손가락 에임 조준 후 놓아서 발사!";
            }

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function returnToMenu() {
            gameRunning = false;
            cancelAnimationFrame(animationFrameId);
            gameContainer.classList.remove('active');
            menu.classList.remove('hidden');
        }

        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function update() {
            const difficulty = getDifficulty();

            if (joystick.active) {
                let dx = joystick.currentX - joystick.startX;
                let dy = joystick.currentY - joystick.startY;
                let dist = Math.hypot(dx, dy);

                if (dist > 2) {
                    let angle = Math.atan2(dy, dx);
                    let moveDist = Math.min(dist, joystick.maxDist) / joystick.maxDist * player.speed;
                    player.x += Math.cos(angle) * moveDist;
                    player.y += Math.sin(angle) * moveDist;

                    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
                    player.y = Math.max(player.radius + 60, Math.min(canvas.height - player.radius, player.y));
                }
            }

            if (currentMode === 'aim' && ammo < 3) {
                ammoRegenTimer++;
                if (ammoRegenTimer >= 90) {
                    ammo++;
                    ammoRegenTimer = 0;
                }
            }

            spawnCounter--;

            if (currentMode === 'dodge') {
                const spawnInterval = Math.max(10, Math.round(30 / difficulty));
                if (spawnCounter <= 0) {
                    spawnCounter = spawnInterval;
                    let side = Math.floor(Math.random() * 4);
                    let x, y;
                    if (side === 0) { x = Math.random() * canvas.width; y = 0; }
                    else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height; }
                    else if (side === 2) { x = 0; y = Math.random() * canvas.height; }
                    else { x = canvas.width; y = Math.random() * canvas.height; }

                    let angle = Math.atan2(player.y - y, player.x - x);
                    let speed = (3 + Math.random() * 2) * difficulty;

                    entities.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: 10 });
                }

                for (let i = entities.length - 1; i >= 0; i--) {
                    let b = entities[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    let dist = Math.hypot(player.x - b.x, player.y - b.y);
                    if (dist < player.radius + b.radius) {
                        entities.splice(i, 1);
                        lives--;
                        if (lives <= 0) {
                            alert(`디노 트레이닝 게임 오버! 최종 점수: ${score}`);
                            returnToMenu();
                        }
                    } else if (b.x < -50 || b.x > canvas.width + 50 || b.y < -50 || b.y > canvas.height + 50) {
                        entities.splice(i, 1);
                        score += 10;
                    }
                }

            } else if (currentMode === 'aim') {
                const spawnInterval = Math.max(25, Math.round(65 / difficulty));
                if (spawnCounter <= 0 && entities.length < 5) {
                    spawnCounter = spawnInterval;
                    let ex = Math.random() < 0.5 ? 80 : canvas.width - 80;
                    let ey = Math.random() * (canvas.height - 200) + 100;
                    entities.push({
                        x: ex, y: ey,
                        vx: (Math.random() - 0.5) * 2 * difficulty,
                        vy: (Math.random() - 0.5) * 2 * difficulty,
                        radius: 22,
                        lifeTime: 0
                    });
                }

                for (let i = entities.length - 1; i >= 0; i--) {
                    let target = entities[i];
                    target.x += target.vx;
                    target.y += target.vy;
                    if (target.x < 50 || target.x > canvas.width - 50) target.vx *= -1;
                    if (target.y < 80 || target.y > canvas.height - 50) target.vy *= -1;

                    target.lifeTime++;
                    if (target.lifeTime > 280) {
                        entities.splice(i, 1);
                        lives--;
                        if (lives <= 0) {
                            alert(`디노 트레이닝 게임 오버! 최종 점수: ${score}`);
                            returnToMenu();
                        }
                    }
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    let bullet = bullets[i];
                    bullet.x += bullet.vx;
                    bullet.y += bullet.vy;
                    bullet.distanceTraveled += Math.hypot(bullet.vx, bullet.vy);

                    let hitIndex = -1;
                    for (let j = 0; j < entities.length; j++) {
                        let target = entities[j];
                        if (Math.hypot(bullet.x - target.x, bullet.y - target.y) < bullet.radius + target.radius) {
                            hitIndex = j;
                            break;
                        }
                    }

                    if (hitIndex !== -1) {
                        entities.splice(hitIndex, 1);
                        bullets.splice(i, 1);
                        score += 150;
                    } else if (bullet.distanceTraveled >= bullet.maxDistance || bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height) {
                        bullets.splice(i, 1);
                    }
                }
            }

            scoreBoard.innerText = `점수: ${score}`;
            difficultyBoard.innerText = `속도: x${difficulty.toFixed(1)}`;
            let ammoStrs = '';
            for (let i = 0; i < 3; i++) ammoStrs += (i < ammo) ? '🟡' : '⚪';
            ammoBoard.innerText = `탄창: ${ammoStrs}`;
            
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️';
            lifeBoard.innerText = `생명: ${hearts}`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 배경 격자 패턴 그리기 (맵 느낌)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            let gridSize = 60;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // 에임 조준선 가이드라인
            if (currentMode === 'aim' && aimStick.active) {
                let dx = aimStick.currentX - aimStick.startX;
                let dy = aimStick.currentY - aimStick.startY;
                let dist = Math.hypot(dx, dy);
                if (dist > 15) {
                    let angle = Math.atan2(dy, dx);
                    ctx.beginPath();
                    ctx.moveTo(player.x, player.y);
                    ctx.lineTo(player.x + Math.cos(angle) * 300, player.y + Math.sin(angle) * 300);
                    ctx.strokeStyle = 'rgba(255, 255, 0, 0.5)';
                    ctx.lineWidth = 4;
                    ctx.setLineDash([8, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.closePath();
                }
            }

            // 플레이어 캐릭터
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.closePath();

            // 오브젝트 렌더링
            if (currentMode === 'dodge') {
                for (let b of entities) {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff4757';
                    ctx.fill();
                    ctx.closePath();
                }
            } else if (currentMode === 'aim') {
                for (let t of entities) {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff6b81';
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                    ctx.closePath();
                }
                for (let bullet of bullets) {
                    ctx.beginPath();
                    ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffd700';
                    ctx.fill();
                    ctx.closePath();
                }
            }

            // 이동 조이스틱 표시
            if (joystick.active) {
                ctx.beginPath();
                ctx.arc(joystick.startX, joystick.startY, 45, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.stroke();
                ctx.closePath();

                let dx = joystick.currentX - joystick.startX;
                let dy = joystick.currentY - joystick.startY;
                let dist = Math.hypot(dx, dy);
                let stickX = joystick.startX + (dist > joystick.maxDist ? dx / dist * joystick.maxDist : dx);
                let stickY = joystick.startY + (dist > joystick.maxDist ? dy / dist * joystick.maxDist : dy);

                ctx.beginPath();
                ctx.arc(stickX, stickY, 22, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
                ctx.closePath();
            }

            // 에임 조이스틱 표시
            if (aimStick.active) {
                ctx.beginPath();
                ctx.arc(aimStick.startX, aimStick.startY, 45, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(46, 213, 115, 0.15)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(46, 213, 115, 0.3)';
                ctx.stroke();
                ctx.closePath();

                let dx = aimStick.currentX - aimStick.startX;
                let dy = aimStick.currentY - aimStick.startY;
                let dist = Math.hypot(dx, dy);
                let stickX = aimStick.startX + (dist > 50 ? dx / dist * 50 : dx);
                let stickY = aimStick.startY + (dist > 50 ? dy / dist * 50 : dy);

                ctx.beginPath();
                ctx.arc(stickX, stickY, 22, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(46, 213, 115, 0.6)';
                ctx.fill();
                ctx.closePath();
            }
        }
    </script>
</body>
</html>
