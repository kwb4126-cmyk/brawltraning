<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>브롤스타즈 트레이닝 (디노 - 스나이퍼 하드모드)</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0f13">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: #0f0f13;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2c2c54 0%, #10101b 100%);
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 26px;
            color: #ffd700;
            text-shadow: 0 4px 10px rgba(0,0,0,0.6);
            letter-spacing: 1px;
        }
        .subtitle {
            color: #a4b0be;
            font-size: 13px;
            margin-bottom: 24px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 280px;
        }
        .main-btn {
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: 0.15s;
            color: white;
        }
        .btn-dodge { background: linear-gradient(135deg, #ff4757, #ff6b81); }
        .btn-aim { background: linear-gradient(135deg, #2ed573, #7bed9f); }
        .btn-hard { background: linear-gradient(135deg, #ff4757, #ffa502); border: 2px solid #ffd700; }
        .main-btn:active { transform: scale(0.96); }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            max-width: 1100px;
            max-height: 700px;
            background-color: #1e272e;
            display: none;
            overflow: hidden;
        }
        @media (min-width: 768px) {
            #game-container {
                width: 94vw;
                height: 90vh;
                border: 5px solid #3d3d5c;
                border-radius: 20px;
                box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            }
        }
        #game-container.active {
            display: block;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            background-color: #2f3542;
        }

        #ui-panel {
            position: absolute;
            top: 12px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .hud-group {
            display: flex;
            gap: 8px;
        }
        .hud-badge {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #score-board { color: #00d2d3; }
        #difficulty-board { color: #ffa502; }
        #ammo-board { color: #fffa65; }
        #life-board { color: #ff6b81; }

        .btn-back {
            position: absolute;
            top: 12px;
            left: 15px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            z-index: 10;
        }

        .guide {
            position: absolute;
            bottom: 8px;
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            text-shadow: 1px 1px 2px #000;
            pointer-events: none;
            z-index: 5;
        }

        #ai-modal {
            position: absolute;
            inset: 0;
            background: rgba(11, 19, 43, 0.92);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
            overflow-y: auto;
        }
        .ai-card {
            background: #1e272e;
            border: 3px solid #ffd700;
            border-radius: 16px;
            padding: 18px 20px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin: auto;
        }
        .ai-title {
            color: #ffd700;
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 8px;
            text-align: center;
        }
        .ai-content {
            font-size: 13px;
            line-height: 1.5;
            color: #f1f2f6;
            margin-bottom: 16px;
            background: rgba(0,0,0,0.4);
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid #ffd700;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }
        .ai-btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .ai-btn {
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-retry { background: #2ed573; color: white; }
        .btn-home { background: #747d8c; color: white; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>브롤스타즈 트레이닝 (디노)</h1>
        <div class="subtitle">극한의 손가락 피지컬 및 고속 무빙 훈련 버전</div>
        <div class="btn-group">
            <button class="main-btn btn-dodge" onclick="startGame('dodge')">무빙 훈련 (회피)</button>
            <button class="main-btn btn-aim" onclick="startGame('aim')">저격 에임 훈련 (일반)</button>
            <button class="main-btn btn-hard" onclick="startGame('sniper_hard')">🎯 스나이퍼 하드모드 (극악 피지컬)</button>
        </div>
    </div>

    <div id="game-container">
        <button class="btn-back" onclick="returnToMenu()">메뉴로</button>
        
        <div id="ui-panel">
            <div class="hud-group">
                <div class="hud-badge" id="score-board">점수: 0</div>
                <div class="hud-badge" id="difficulty-board">속도: x1.0</div>
            </div>
            <div class="hud-group">
                <div class="hud-badge" id="ammo-board">탄창: 🟡🟡🟡</div>
                <div class="hud-badge" id="life-board">생명: ❤️❤️❤️</div>
            </div>
        </div>

        <canvas id="canvas"></canvas>
        <div class="guide" id="guide-text">조작 가이드</div>

        <div id="ai-modal">
            <div class="ai-card">
                <div class="ai-title">🤖 브롤스타즈 AI 전용 코치</div>
                <div class="ai-content" id="ai-feedback-text">전투 데이터를 분석 중입니다...</div>
                <div class="ai-btn-group">
                    <button class="ai-btn btn-retry" onclick="restartGame()">다시 도전</button>
                    <button class="ai-btn btn-home" onclick="returnToMenu()">메뉴로</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const gameContainer = document.getElementById('game-container');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('score-board');
        const difficultyBoard = document.getElementById('difficulty-board');
        const ammoBoard = document.getElementById('ammo-board');
        const lifeBoard = document.getElementById('life-board');
        const guideText = document.getElementById('guide-text');
        const aiModal = document.getElementById('ai-modal');
        const aiFeedbackText = document.getElementById('ai-feedback-text');

        let currentMode = null;
        let animationFrameId = null;
        let score = 0;
        let lives = 3;
        let ammo = 3;
        let ammoRegenTimer = 0;
        let gameRunning = false;
        let gameTime = 0;

        function getDifficulty() {
            return Math.min(4.5, 1 + score / 180);
        }

        let player = { x: 0, y: 0, radius: 18, speed: 5.0, color: '#1e90ff' };
        let joystick = { active: false, pointerId: null, startX: 0, startY: 0, currentX: 0, currentY: 0, maxDist: 45 };
        let aimStick = { active: false, pointerId: null, startX: 0, startY: 0, currentX: 0, currentY: 0 };
        let entities = []; 
        let bullets = [];  
        let spawnCounter = 0;
        let activeTouches = {};

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        canvas.addEventListener('pointerdown', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            activeTouches[e.pointerId] = pos;

            if (currentMode === 'dodge') {
                if (!joystick.active) {
                    joystick.active = true;
                    joystick.pointerId = e.pointerId;
                    joystick.startX = pos.x;
                    joystick.startY = pos.y;
                    joystick.currentX = pos.x;
                    joystick.currentY = pos.y;
                }
            } else if (currentMode === 'aim' || currentMode === 'sniper_hard') {
                if (!aimStick.active && ammo > 0) {
                    aimStick.active = true;
                    aimStick.pointerId = e.pointerId;
                    aimStick.startX = pos.x;
                    aimStick.startY = pos.y;
                    aimStick.currentX = pos.x;
                    aimStick.currentY = pos.y;
                }
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!gameRunning) return;
            if (!activeTouches[e.pointerId]) return;
            const rect = canvas.getBoundingClientRect();
            const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
            activeTouches[e.pointerId] = pos;

            if (joystick.active && e.pointerId === joystick.pointerId) {
                joystick.currentX = pos.x;
                joystick.currentY = pos.y;
            }
            if (aimStick.active && e.pointerId === aimStick.pointerId) {
                aimStick.currentX = pos.x;
                aimStick.currentY = pos.y;
            }
        });

        canvas.addEventListener('pointerup', (e) => { handlePointerEnd(e); });
        canvas.addEventListener('pointercancel', (e) => { handlePointerEnd(e); });

        function handlePointerEnd(e) {
            delete activeTouches[e.pointerId];

            if (joystick.active && e.pointerId === joystick.pointerId) {
                joystick.active = false;
                joystick.pointerId = null;
            }

            if (aimStick.active && e.pointerId === aimStick.pointerId) {
                if ((currentMode === 'aim' || currentMode === 'sniper_hard') && ammo > 0) {
                    let dx = aimStick.currentX - aimStick.startX;
                    let dy = aimStick.currentY - aimStick.startY;
                    let dist = Math.hypot(dx, dy);

                    if (dist > 12) {
                        let angle = Math.atan2(dy, dx);
                        let bulletSpeed = currentMode === 'sniper_hard' ? 16 : 14;
                        bullets.push({
                            x: player.x,
                            y: player.y,
                            vx: Math.cos(angle) * bulletSpeed,
                            vy: Math.sin(angle) * bulletSpeed,
                            radius: currentMode === 'sniper_hard' ? 6 : 7,
                            distanceTraveled: 0,
                            maxDistance: Math.max(canvas.width, canvas.height) * 0.95
                        });
                        ammo--;
                    }
                }
                aimStick.active = false;
                aimStick.pointerId = null;
            }
        }

        function startGame(mode) {
            currentMode = mode;
            menu.classList.add('hidden');
            gameContainer.classList.add('active');
            aiModal.style.display = 'none';

            resizeCanvas();

            score = 0;
            lives = 3;
            ammo = 3;
            ammoRegenTimer = 0;
            gameTime = 0;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            entities = [];
            bullets = [];
            spawnCounter = 0;
            gameRunning = true;

            if (currentMode === 'dodge') {
                guideText.innerText = "[무빙 훈련] 극한의 반응 속도로 탄환을 회피하세요!";
            } else if (currentMode === 'aim') {
                guideText.innerText = "[저격 일반] 신속하고 정확한 에어밍 연습!";
            } else {
                guideText.innerText = "[스나이퍼 하드모드] 고속 변칙 와리가리 피지컬 훈련!";
            }

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function restartGame() {
            startGame(currentMode);
        }

        function returnToMenu() {
            gameRunning = false;
            cancelAnimationFrame(animationFrameId);
            aiModal.style.display = 'none';
            gameContainer.classList.remove('active');
            menu.classList.remove('hidden');
        }

        function generateBrawlAIFeedback(mode, score, survivalSeconds) {
            let feedback = "";
            if (mode === 'sniper_hard') {
                if (score < 400) {
                    feedback = `[피지컬 분석: 하드모드 수련생]\n- 점수: ${score}점\n\n"변칙적인 AI의 무빙 타이밍에 손가락 반응이 조금 늦었습니다. 에임을 미리 고정하지 말고 드래그 스냅 속도를 높여보세요!"`;
                } else if (score < 1000) {
                    feedback = `[피지컬 분석: 하드모드 상위권]\n- 점수: ${score}점\n\n"훌륭한 손가락 반사 신경입니다! 고속 무빙을 추적하는 에임 스냅이 매우 날카로워졌습니다."`;
                } else {
                    feedback = `[피지컬 분석: 월드 챔피언 급 피지컬]\n- 점수: ${score}점\n\n"경이로운 반응 속도! 미친 듯이 도망치는 AI마저 완벽하게 도륙내는 최상위권 피지컬입니다!"`;
                }
            } else {
                feedback = `[전투 피지컬 분석 완료]\n- 점수: ${score}점 (생존: ${survivalSeconds}초)\n\n"안정적인 무빙과 에임입니다. 더 높은 자극을 위해 하드모드에 도전해 손가락 한계에 부딪혀 보세요."`;
            }
            aiFeedbackText.innerText = feedback;
            aiModal.style.display = 'flex';
        }

        function triggerGameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationFrameId);
            const survivalSeconds = Math.floor(gameTime / 60);
            
            aiFeedbackText.innerText = "브롤 AI 코치가 피지컬 데이터를 정밀 연산 중입니다...";
            aiModal.style.display = 'flex';
            
            setTimeout(() => {
                generateBrawlAIFeedback(currentMode, score, survivalSeconds);
            }, 700);
        }

        function gameLoop() {
            if (!gameRunning) return;
            gameTime++;
            update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function update() {
            const difficulty = getDifficulty();

            if (currentMode === 'dodge' && joystick.active) {
                let dx = joystick.currentX - joystick.startX;
                let dy = joystick.currentY - joystick.startY;
                let dist = Math.hypot(dx, dy);

                if (dist > 2) {
                    let angle = Math.atan2(dy, dx);
                    let moveDist = Math.min(dist, joystick.maxDist) / joystick.maxDist * player.speed;
                    player.x += Math.cos(angle) * moveDist;
                    player.y += Math.sin(angle) * moveDist;

                    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
                    player.y = Math.max(player.radius + 40, Math.min(canvas.height - player.radius, player.y));
                }
            }

            if ((currentMode === 'aim' || currentMode === 'sniper_hard') && ammo < 3) {
                ammoRegenTimer++;
                if (ammoRegenTimer >= (currentMode === 'sniper_hard' ? 60 : 75)) {
                    ammo++;
                    ammoRegenTimer = 0;
                }
            }

            spawnCounter--;

            if (currentMode === 'dodge') {
                const spawnInterval = Math.max(6, Math.round(24 / difficulty));
                if (spawnCounter <= 0) {
                    spawnCounter = spawnInterval;
                    let side = Math.floor(Math.random() * 4);
                    let x, y;
                    if (side === 0) { x = Math.random() * canvas.width; y = 0; }
                    else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height; }
                    else if (side === 2) { x = 0; y = Math.random() * canvas.height; }
                    else { x = canvas.width; y = Math.random() * canvas.height; }

                    let angle = Math.atan2(player.y - y, player.x - x);
                    let speed = (3.2 + Math.random() * 2.0) * difficulty;

                    entities.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: 9 });
                }

                for (let i = entities.length - 1; i >= 0; i--) {
                    let b = entities[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    let dist = Math.hypot(player.x - b.x, player.y - b.y);
                    if (dist < player.radius + b.radius) {
                        entities.splice(i, 1);
                        lives--;
                        if (lives <= 0) { triggerGameOver(); return; }
                    } else if (b.x < -40 || b.x > canvas.width + 40 || b.y < -40 || b.y > canvas.height + 40) {
                        entities.splice(i, 1);
                        score += 10;
                    }
                }
            } else if (currentMode === 'aim' || currentMode === 'sniper_hard') {
                const maxEntities = currentMode === 'sniper_hard' ? 4 : 5;
                const spawnInterval = currentMode === 'sniper_hard' ? Math.max(12, Math.round(38 / difficulty)) : Math.max(18, Math.round(55 / difficulty));
                
                if (spawnCounter <= 0 && entities.length < maxEntities) {
                    spawnCounter = spawnInterval;
                    let ex = Math.random() * (canvas.width - 120) + 60;
                    let ey = Math.random() * (canvas.height - 180) + 90;
                    entities.push({
                        x: ex, y: ey,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4,
                        radius: currentMode === 'sniper_hard' ? 14 : 18,
                        lifeTime: 0,
                        changeTimer: 0
                    });
                }

                for (let i = entities.length - 1; i >= 0; i--) {
                    let target = entities[i];
                    
                    if (currentMode === 'sniper_hard') {
                        target.changeTimer++;
                        // 극악 피지컬용 초고속 변칙 무빙 (방향 급 전환 및 가속)
                        if (target.changeTimer > 15 + Math.random() * 12) {
                            let speedBoost = (3.5 + Math.random() * 3.0) * difficulty;
                            let angle = Math.random() * Math.PI * 2;
                            target.vx = Math.cos(angle) * speedBoost;
                            target.vy = Math.sin(angle) * speedBoost;
                            target.changeTimer = 0;
                        }
                    }

                    target.x += target.vx;
                    target.y += target.vy;

                    if (target.x < 40 || target.x > canvas.width - 40) { target.vx *= -1; target.x = Math.max(40, Math.min(canvas.width - 40, target.x)); }
                    if (target.y < 70 || target.y > canvas.height - 40) { target.vy *= -1; target.y = Math.max(70, Math.min(canvas.height - 40, target.y)); }

                    target.lifeTime++;
                    let maxLife = currentMode === 'sniper_hard' ? 150 : 240;
                    if (target.lifeTime > maxLife) {
                        entities.splice(i, 1);
                        lives--;
                        if (lives <= 0) { triggerGameOver(); return; }
                    }
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    let bullet = bullets[i];
                    bullet.x += bullet.vx;
                    bullet.y += bullet.vy;
                    bullet.distanceTraveled += Math.hypot(bullet.vx, bullet.vy);

                    let hitIndex = -1;
                    for (let j = 0; j < entities.length; j++) {
                        let target = entities[j];
                        if (Math.hypot(bullet.x - target.x, bullet.y - target.y) < bullet.radius + target.radius) {
                            hitIndex = j;
                            break;
                        }
                    }

                    if (hitIndex !== -1) {
                        entities.splice(hitIndex, 1);
                        bullets.splice(i, 1);
                        score += currentMode === 'sniper_hard' ? 300 : 150;
                    } else if (bullet.distanceTraveled >= bullet.maxDistance || bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height) {
                        bullets.splice(i, 1);
                    }
                }
            }

            scoreBoard.innerText = `점수: ${score}`;
            difficultyBoard.innerText = `속도: x${difficulty.toFixed(1)}`;
            let ammoStrs = '';
            for (let i = 0; i < 3; i++) ammoStrs += (i < ammo) ? '🟡' : '⚪';
            ammoBoard.innerText = `탄창: ${ammoStrs}`;
            
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️';
            lifeBoard.innerText = `생명: ${hearts}`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 1;
            let gridSize = 50;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            if ((currentMode === 'aim' || currentMode === 'sniper_hard') && aimStick.active) {
                let dx = aimStick.currentX - aimStick.startX;
                let dy = aimStick.currentY - aimStick.startY;
                let dist = Math.hypot(dx, dy);
                if (dist > 12) {
                    let angle = Math.atan2(dy, dx);
                    ctx.beginPath();
                    ctx.moveTo(player.x, player.y);
                    ctx.lineTo(player.x + Math.cos(angle) * 380, player.y + Math.sin(angle) * 380);
                    ctx.strokeStyle = currentMode === 'sniper_hard' ? 'rgba(255, 71, 87, 0.8)' : 'rgba(255, 234, 167, 0.7)';
                    ctx.lineWidth = 4;
                    ctx.setLineDash([6, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.closePath();
                }
            }

            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = currentMode === 'sniper_hard' ? '#ff4757' : player.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = currentMode === 'sniper_hard' ? '#ffa502' : '#ffffff';
            ctx.stroke();
            ctx.closePath();

            if (currentMode === 'dodge') {
                for (let b of entities) {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff4757';
                    ctx.fill();
                    ctx.closePath();
                }
            } else if (currentMode === 'aim' || currentMode === 'sniper_hard') {
                for (let t of entities) {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                    ctx.fillStyle = currentMode === 'sniper_hard' ? '#ffa502' : '#ff6b81';
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                    ctx.closePath();
                }
                for (let bullet of bullets) {
                    ctx.beginPath();
                    ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffd700';
                    ctx.fill();
                    ctx.closePath();
                }
            }

            if (currentMode === 'dodge' && joystick.active) {
                ctx.beginPath();
                ctx.arc(joystick.startX, joystick.startY, 42, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.stroke();
                ctx.closePath();

                let dx = joystick.currentX - joystick.startX;
                let dy = joystick.currentY - joystick.startY;
                let dist = Math.hypot(dx, dy);
                let stickX = joystick.startX + (dist > joystick.maxDist ? dx / dist * joystick.maxDist : dx);
                let stickY = joystick.startY + (dist > joystick.maxDist ? dy / dist * joystick.maxDist : dy);

                ctx.beginPath();
                ctx.arc(stickX, stickY, 20, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.fill();
                ctx.closePath();
            }

            if ((currentMode === 'aim' || currentMode === 'sniper_hard') && aimStick.active) {
                ctx.beginPath();
                ctx.arc(aimStick.startX, aimStick.startY, 42, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 107, 107, 0.12)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 107, 107, 0.25)';
                ctx.stroke();
                ctx.closePath();

                let dx = aimStick.currentX - aimStick.startX;
                let dy = aimStick.currentY - aimStick.startY;
                let dist = Math.hypot(dx, dy);
                let stickX = aimStick.startX + (dist > 45 ? dx / dist * 45 : dx);
                let stickY = aimStick.startY + (dist > 45 ? dy / dist * 45 : dy);

                ctx.beginPath();
                ctx.arc(stickX, stickY, 20, 0, Math.PI * 2);
                ctx.fillStyle = currentMode === 'sniper_hard' ? 'rgba(255, 71, 87, 0.65)' : 'rgba(46, 213, 115, 0.55)';
                ctx.fill();
                ctx.closePath();
            }
        }
    </script>
