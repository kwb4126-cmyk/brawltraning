<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>브롤스타즈 트레이닝 사이트 (디노)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            margin: 5px 0;
            font-size: 24px;
            color: #ffd700;
        }
        #menu, #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-dodge { background-color: #ff4757; color: white; }
        .btn-aim { background-color: #2ed573; color: white; }
        .btn-back { background-color: #747d8c; color: white; margin-top: 10px; }
        button:hover { opacity: 0.85; transform: scale(1.05); }

        canvas {
            background-color: #2f3542;
            border: 4px solid #57606f;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            touch-action: none;
            max-width: 96vw;
            max-height: 72vh;
        }
        #ui-panel {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            padding: 0 6px;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: bold;
        }
        #difficulty-board {
            color: #ffa502;
        }
        .hidden {
            display: none !important;
        }
        .guide {
            font-size: 13px;
            color: #a4b0be;
            margin-top: 5px;
            text-align: center;
        }

        /* 세로 모드 안내 오버레이 */
        .rotate-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #0d0d0d;
            color: #fff;
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 14px;
            padding: 20px;
        }
        .rotate-icon {
            font-size: 56px;
            animation: rotatePulse 1.3s ease-in-out infinite;
        }
        @keyframes rotatePulse {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        @media screen and (orientation: portrait) and (max-width: 900px) {
            #menu, #game-container { display: none !important; }
            .rotate-overlay { display: flex; }
        }
    </style>
</head>
<body>

    <div class="rotate-overlay" id="rotateOverlay">
        <div class="rotate-icon">📱</div>
        <h1 style="margin:0;">가로모드로 플레이해주세요</h1>
        <p>기기를 옆으로 돌리면 브롤스타즈 트레이닝 사이트 (디노)가 시작됩니다.</p>
    </div>

    <!-- 메인 메뉴 -->
    <div id="menu">
        <h1>브롤스타즈 트레이닝 사이트 (디노)</h1>
        <p>원하는 훈련 모드를 선택하세요</p>
        <div class="btn-group">
            <button class="btn-dodge" onclick="startGame('dodge')">무빙 훈련 (회피)</button>
            <button class="btn-aim" onclick="startGame('aim')">저격 에임 훈련 (사격)</button>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div id="game-container" class="hidden">
        <div id="ui-panel">
            <span id="score-board">점수: 0</span>
            <span id="difficulty-board">속도: x1.0</span>
            <span id="ammo-board">탄창: 🟡🟡🟡</span>
            <span id="life-board">생명: ❤️❤️❤️</span>
        </div>
        <canvas id="canvas" width="700" height="450"></canvas>
        <div class="guide" id="guide-text">화면 아무 곳이나 터치하면 그 자리에 조이스틱이 생깁니다!</div>
        <button class="btn-back" onclick="returnToMenu()">메뉴로 돌아가기</button>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const gameContainer = document.getElementById('game-container');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreBoard = document.getElementById('score-board');
        const difficultyBoard = document.getElementById('difficulty-board');
        const ammoBoard = document.getElementById('ammo-board');
        const lifeBoard = document.getElementById('life-board');
        const guideText = document.getElementById('guide-text');

        let currentMode = null;
        let animationFrameId = null;
        let score = 0;
        let lives = 3;
        let ammo = 3;
        let ammoRegenTimer = 0;
        let gameRunning = false;

        // 점수에 따라 난이도(속도)가 점점 빨라짐 (최대 3배)
        function getDifficulty() {
            return Math.min(3.0, 1 + score / 300);
        }

        let player = {
            x: 350,
            y: 225,
            radius: 16,
            speed: 3.5,
            color: '#1e90ff'
        };

        // 플로팅 조이스틱 (첫 번째 손가락: 이동)
        let joystick = {
            active: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            currentX: 0,
            currentY: 0,
            maxDist: 40
        };

        // 플로팅 에임 스틱 (두 번째 손가락: 저격 조준 및 발사)
        let aimStick = {
            active: false,
            pointerId: null,
            startX: 0,
            startY: 0,
            currentX: 0,
            currentY: 0
        };

        let entities = []; 
        let bullets = [];  
        let spawnCounter = 0;
        let activeTouches = {};

        function getTouchPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!gameRunning) return;
            const pos = getTouchPos(e);
            activeTouches[e.pointerId] = pos;

            // 첫 번째 터치 = 이동 조이스틱 (화면 어디서든 생성)
            if (!joystick.active) {
                joystick.active = true;
                joystick.pointerId = e.pointerId;
                joystick.startX = pos.x;
                joystick.startY = pos.y;
                joystick.currentX = pos.x;
                joystick.currentY = pos.y;
            } 
            // 두 번째 터치 = 저격 에임 조이스틱 (에임 모드일 때만 활성화)
            else if (currentMode === 'aim' && !aimStick.active && ammo > 0 && e.pointerId !== joystick.pointerId) {
                aimStick.active = true;
                aimStick.pointerId = e.pointerId;
                aimStick.startX = pos.x;
                aimStick.startY = pos.y;
                aimStick.currentX = pos.x;
                aimStick.currentY = pos.y;
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!gameRunning) return;
            if (!activeTouches[e.pointerId]) return;
            const pos = getTouchPos(e);
            activeTouches[e.pointerId] = pos;

            if (joystick.active && e.pointerId === joystick.pointerId) {
                joystick.currentX = pos.x;
                joystick.currentY = pos.y;
            }
            if (aimStick.active && e.pointerId === aimStick.pointerId) {
                aimStick.currentX = pos.x;
                aimStick.currentY = pos.y;
            }
        });

        canvas.addEventListener('pointerup', (e) => { handlePointerEnd(e); });
        canvas.addEventListener('pointercancel', (e) => { handlePointerEnd(e); });

        function handlePointerEnd(e) {
            delete activeTouches[e.pointerId];

            if (joystick.active && e.pointerId === joystick.pointerId) {
                joystick.active = false;
                joystick.pointerId = null;
            }

            // 에임 스틱에서 손을 뗄 때 저격 총알 발사!
            if (aimStick.active && e.pointerId === aimStick.pointerId) {
                if (currentMode === 'aim' && ammo > 0) {
                    let dx = aimStick.currentX - aimStick.startX;
                    let dy = aimStick.currentY - aimStick.startY;
                    let dist = Math.hypot(dx, dy);

                    if (dist > 10) {
                        let angle = Math.atan2(dy, dx);
                        bullets.push({
                            x: player.x,
                            y: player.y,
                            vx: Math.cos(angle) * 10,
                            vy: Math.sin(angle) * 10,
                            radius: 6,
                            distanceTraveled: 0,
                            maxDistance: 350
                        });
                        ammo--;
                    }
                }
                aimStick.active = false;
                aimStick.pointerId = null;
            }
        }

        function resizeCanvas() {
            const aspect = 450 / 700;
            let w = Math.min(900, window.innerWidth * 0.96);
            let h = w * aspect;
            const maxH = window.innerHeight * 0.7;
            if (h > maxH) {
                h = maxH;
                w = h / aspect;
            }
            canvas.width = Math.round(w);
            canvas.height = Math.round(h);
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);
        resizeCanvas();

        function startGame(mode) {
            currentMode = mode;
            menu.classList.add('hidden');
            gameContainer.classList.remove('hidden');

            resizeCanvas();

            score = 0;
            lives = 3;
            ammo = 3;
            ammoRegenTimer = 0;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            entities = [];
            bullets = [];
            spawnCounter = 0;
            gameRunning = true;

            if (currentMode === 'dodge') {
                guideText.innerText = "[무빙 훈련] 화면 어디든 터치하고 드래그해 탄환을 피하세요! 점수가 오를수록 속도가 빨라집니다.";
            } else {
                guideText.innerText = "[저격 에임 훈련] 한 손가락으로 이동, 다른 손가락으로 당겼다 놓으면 저격 발사!";
            }

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        function returnToMenu() {
            gameRunning = false;
            cancelAnimationFrame(animationFrameId);
            gameContainer.classList.add('hidden');
            menu.classList.remove('hidden');
        }

        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function update() {
            const difficulty = getDifficulty();

            // 이동 조이스틱 제어
            if (joystick.active) {
                let dx = joystick.currentX - joystick.startX;
                let dy = joystick.currentY - joystick.startY;
                let dist = Math.hypot(dx, dy);

                if (dist > 2) {
                    let angle = Math.atan2(dy, dx);
                    let moveDist = Math.min(dist, joystick.maxDist) / joystick.maxDist * player.speed;
                    player.x += Math.cos(angle) * moveDist;
                    player.y += Math.sin(angle) * moveDist;

                    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
                    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
                }
            }

            // 브롤스타즈 탄창 자동 충전 시스템
            if (currentMode === 'aim' && ammo < 3) {
                ammoRegenTimer++;
                if (ammoRegenTimer >= 90) {
                    ammo++;
                    ammoRegenTimer = 0;
                }
            }

            spawnCounter--;

            if (currentMode === 'dodge') {
                const spawnInterval = Math.max(12, Math.round(35 / difficulty));
                if (spawnCounter <= 0) {
                    spawnCounter = spawnInterval;
                    let side = Math.floor(Math.random() * 4);
                    let x, y;
                    if (side === 0) { x = Math.random() * canvas.width; y = 0; }
                    else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height; }
                    else if (side === 2) { x = 0; y = Math.random() * canvas.height; }
                    else { x = canvas.width; y = Math.random() * canvas.height; }

                    let angle = Math.atan2(player.y - y, player.x - x);
                    let speed = (2.5 + Math.random() * 1.5) * difficulty;

                    entities.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: 8 });
                }

                for (let i = entities.length - 1; i >= 0; i--) {
                    let b = entities[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    let dist = Math.hypot(player.x - b.x, player.y - b.y);
                    if (dist < player.radius + b.radius) {
                        entities.splice(i, 1);
                        lives--;
                        if (lives <= 0) {
                            alert(`게임 오버! 최종 점수: ${score}`);
                            returnToMenu();
                        }
                    } else if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                        entities.splice(i, 1);
                        score += 10;
                    }
                }

            } else if (currentMode === 'aim') {
                const spawnInterval = Math.max(30, Math.round(75 / difficulty));
                if (spawnCounter <= 0 && entities.length < 4) {
                    spawnCounter = spawnInterval;
                    let ex = Math.random() < 0.5 ? 50 : canvas.width - 50;
                    let ey = Math.random() * (canvas.height - 100) + 50;
                    entities.push({
                        x: ex, y: ey,
                        vx: (Math.random() - 0.5) * 1.5 * difficulty,
                        vy: (Math.random() - 0.5) * 1.5 * difficulty,
                        radius: 18,
                        lifeTime: 0
                    });
                }

                for (let i = entities.length - 1; i >= 0; i--) {
                    let target = entities[i];
                    target.x += target.vx;
                    target.y += target.vy;
                    if (target.x < 30 || target.x > canvas.width - 30) target.vx *= -1;
                    if (target.y < 30 || target.y > canvas.height - 30) target.vy *= -1;

                    target.lifeTime++;
                    if (target.lifeTime > 240) {
                        entities.splice(i, 1);
                        lives--;
                        if (lives <= 0) {
                            alert(`게임 오버! 최종 점수: ${score}`);
                            returnToMenu();
                        }
                    }
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    let bullet = bullets[i];
                    bullet.x += bullet.vx;
                    bullet.y += bullet.vy;
                    bullet.distanceTraveled += Math.hypot(bullet.vx, bullet.vy);

                    let hitIndex = -1;
                    for (let j = 0; j < entities.length; j++) {
                        let target = entities[j];
                        if (Math.hypot(bullet.x - target.x, bullet.y - target.y) < bullet.radius + target.radius) {
                            hitIndex = j;
                            break;
                        }
                    }

                    if (hitIndex !== -1) {
                        entities.splice(hitIndex, 1);
                        bullets.splice(i, 1);
                        score += 150;
                    } else if (bullet.distanceTraveled >= bullet.maxDistance || bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height) {
                        bullets.splice(i, 1);
                    }
                }
            }

            // UI 업데이트
            scoreBoard.innerText = `점수: ${score}`;
            difficultyBoard.innerText = `속도: x${difficulty.toFixed(1)}`;
            let ammoStrs = '';
            for (let i = 0; i < 3; i++) ammoStrs += (i < ammo) ? '🟡' : '⚪';
            ammoBoard.innerText = `탄창: ${ammoStrs}`;
            
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️';
            lifeBoard.innerText = `생명: ${hearts}`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 저격 조준선 가이드라인
            if (currentMode === 'aim' && aimStick.active) {
                let dx = aimStick.currentX - aimStick.startX;
                let dy = aimStick.currentY - aimStick.startY;
                let dist = Math.hypot(dx, dy);
                if (dist > 10) {
                    let angle = Math.atan2(dy, dx);
                    ctx.beginPath();
                    ctx.moveTo(player.x, player.y);
                    ctx.lineTo(player.x + Math.cos(angle) * 200, player.y + Math.sin(angle) * 200);
                    ctx.strokeStyle = 'rgba(255, 255, 0, 0.4)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.closePath();
                }
            }

            // 플레이어
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.closePath();

            // 오브젝트들
            if (currentMode === 'dodge') {
                for (let b of entities) {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff4757';
                    ctx.fill();
                    ctx.closePath();
                }
            } else if (currentMode === 'aim') {
                for (let t of entities) {
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff6b81';
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                    ctx.closePath();
                }
                for (let bullet of bullets) {
                    ctx.beginPath();
                    ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffd700';
                    ctx.fill();
                    ctx.closePath();
                }
            }

            // 이동 조이스틱 시각화 (플로팅)
            if (joystick.active) {
                ctx.beginPath();
                ctx.arc(joystick.startX, joystick.startY, 35, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.stroke();
                ctx.closePath();

                let dx = joystick.currentX - joystick.startX;
                let dy = joystick.currentY - joystick.startY;
                let dist = Math.hypot(dx, dy);
                let stickX = joystick.startX + (dist > joystick.maxDist ? dx / dist * joystick.maxDist : dx);
                let stickY = joystick.startY + (dist > joystick.maxDist ? dy / dist * joystick.maxDist : dy);

                ctx.beginPath();
                ctx.arc(stickX, stickY, 18, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.fill();
                ctx.closePath();
            }

            // 에임 조이스틱 시각화 (플로팅)
            if (aimStick.active) {
                ctx.beginPath();
                ctx.arc(aimStick.startX, aimStick.startY, 35, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(46, 213, 115, 0.15)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(46, 213, 115, 0.3)';
                ctx.stroke();
                ctx.closePath();

                let dx = aimStick.currentX - aimStick.startX;
                let dy = aimStick.currentY - aimStick.startY;
                let dist = Math.hypot(dx, dy);
                let stickX = aimStick.startX + (dist > 40 ? dx / dist * 40 : dx);
                let stickY = aimStick.startY + (dist > 40 ? dy / dist * 40 : dy);

                ctx.beginPath();
                ctx.arc(stickX, stickY, 18, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(46, 213, 115, 0.6)';
                ctx.fill();
                ctx.closePath();
            }
        }
    </script>
</body>
</html>
